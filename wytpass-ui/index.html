<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | WytPass SSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
</head>

<body>
  <div id="app">
    <div class="login-container">
      <div class="login-card">
        <div class="login-header">
          <img src="/logo.png" alt="WytPass Logo" class="logo">
          <h1 id="form-title">Welcome Back</h1>
          <p id="form-subtitle">Enter your credentials to access your account</p>
        </div>

        <form id="auth-form">
          <div class="input-group hidden" id="name-group">
            <label for="name">Full Name</label>
            <input type="text" id="name" placeholder="John Doe">
          </div>

          <div class="input-group">
            <label for="email">Email Address</label>
            <input type="email" id="email" placeholder="name@company.com" required>
          </div>

          <div class="input-group">
            <div class="label-row">
              <label for="password">Password</label>
              <a href="#" class="forgot-link">Forgot password?</a>
            </div>
            <input type="password" id="password" placeholder="••••••••" required>
          </div>

          <div class="remember-me" id="remember-group">
            <input type="checkbox" id="remember">
            <label for="remember">Remember for 30 days</label>
          </div>

          <button type="submit" id="auth-btn">
            <span class="btn-text">Sign In</span>
            <div class="spinner hidden"></div>
          </button>
        </form>

        <div class="oauth-context hidden" id="oauth-context">
          <div class="divider">
            <span>Authorizing</span>
          </div>
          <p class="oauth-info">You are logging in to <span id="client-name">Loading...</span></p>
        </div>

        <div class="login-footer">
          <p id="toggle-text">Don't have an account? <a href="#" id="toggle-auth">Sign up</a></p>
        </div>
      </div>

      <div class="login-decoration">
        <div class="glow-sphere"></div>
        <div class="glass-overlay"></div>
      </div>
    </div>

    <div id="toast-container"></div>
  </div>
  <script type="module" src="/src/main.js"></script>
</body>

</html>
