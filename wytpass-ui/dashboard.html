<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/logo.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Dashboard | WytPass SSO</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap"
    rel="stylesheet">
  <link rel="stylesheet" href="/src/style.css">
  <style>
    body,
    html {
      margin: 0;
      padding: 0;
      height: 100vh;
      overflow: hidden;
      background: var(--bg-dark);
    }

    #app {
      display: flex;
      height: 100vh;
      width: 100vw;
    }

    /* Sidebar */
    .sidebar {
      width: 280px;
      background: rgba(15, 23, 42, 0.6);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-right: 1px solid var(--border);
      display: flex;
      flex-direction: column;
      padding: 32px 24px;
      box-sizing: border-box;
    }

    .sidebar-header {
      margin-bottom: 40px;
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sidebar-header img {
      width: 40px;
      height: 40px;
    }

    .sidebar-header h2 {
      margin: 0;
      color: white;
      font-family: 'Outfit', sans-serif;
      font-size: 22px;
      font-weight: 600;
    }

    .nav-links {
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex-grow: 1;
    }

    .nav-link {
      display: flex;
      align-items: center;
      gap: 12px;
      padding: 14px 16px;
      border-radius: 12px;
      color: var(--text-muted);
      text-decoration: none;
      font-weight: 500;
      font-size: 15px;
      transition: all 0.2s;
      border: 1px solid transparent;
    }

    .nav-link:hover {
      background: rgba(255, 255, 255, 0.05);
      color: white;
    }

    .nav-link.active {
      background: rgba(139, 92, 246, 0.15);
      color: var(--primary);
      border: 1px solid rgba(139, 92, 246, 0.3);
    }

    .nav-link svg {
      width: 20px;
      height: 20px;
    }

    .logout-section {
      margin-top: auto;
      padding-top: 24px;
      border-top: 1px solid var(--border);
    }

    #logout-btn {
      width: 100%;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      padding: 14px;
      border-radius: 12px;
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      background: rgba(239, 68, 68, 0.1);
      border: 1px solid rgba(239, 68, 68, 0.3);
      color: #f87171;
      transition: all 0.2s;
    }

    #logout-btn:hover {
      background: rgba(239, 68, 68, 0.2);
    }

    /* Main Content */
    .main-content {
      flex-grow: 1;
      overflow-y: auto;
      padding: 40px;
      box-sizing: border-box;
      position: relative;
    }

    .main-header {
      margin-bottom: 40px;
    }

    .main-header h1 {
      margin: 0 0 8px 0;
      font-size: 28px;
      color: white;
    }

    .main-header p {
      margin: 0;
      color: var(--text-muted);
      font-size: 16px;
    }

    .content-card {
      background: var(--card-bg);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid var(--border);
      border-radius: 24px;
      padding: 40px;
      box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      max-width: 800px;
    }

    .profile-info {
      margin-bottom: 24px;
    }

    .profile-info:last-child {
      margin-bottom: 0;
    }

    .label {
      font-size: 13px;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 8px;
    }

    .value {
      font-size: 18px;
      color: var(--text-main);
      background: rgba(0, 0, 0, 0.2);
      padding: 12px 16px;
      border-radius: 12px;
      border: 1px solid var(--border);
    }

    .stat-card {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border);
      padding: 24px;
      border-radius: 16px;
      transition: all 0.2s;
    }

    .stat-card:hover {
      background: rgba(255, 255, 255, 0.05);
      transform: translateY(-2px);
    }

    .badge {
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      background: rgba(139, 92, 246, 0.2);
      color: var(--primary);
      border: 1px solid rgba(139, 92, 246, 0.3);
      margin-left: 8px;
    }

    .hidden { display: none !important; }
  </style>
</head>

<body>
  <div id="app">
    <!-- Sidebar -->
    <nav class="sidebar">
      <div class="sidebar-header">
        <img src="/logo.png" alt="WytPass Logo">
        <h2>WytPass</h2>
      </div>

      <div class="nav-links">
        <div class="label" style="margin: 20px 0 10px 16px; font-size: 11px;">Personal</div>
        <a href="/dashboard.html" class="nav-link active">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6">
            </path>
          </svg>
          My Profile
        </a>

        <div class="admin-only hidden">
          <div class="label" style="margin: 24px 0 10px 16px; font-size: 11px;">Administration</div>
          <a href="/users.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z">
              </path>
            </svg>
            Manage Users
          </a>
          <a href="/clients.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
              <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z">
              </path>
            </svg>
            Manage Apps
          </a>
        </div>
      </div>

      <div class="logout-section">
        <button id="logout-btn">
          <svg fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
              d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
          </svg>
          Log Out
        </button>
      </div>
    </nav>

    <!-- Main Content -->
    <main class="main-content">
      <div class="portal-decoration portal-sphere-1"></div>
      <div class="portal-decoration portal-sphere-2"></div>

      <div class="main-header">
        <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 8px;">
          <h1 style="margin:0;">Welcome Back</h1>
          <span id="user-role-badge" class="badge hidden">ADMIN</span>
        </div>
        <p>Here is an overview of your account.</p>
      </div>

      <div class="admin-only hidden" id="admin-overview-section" style="margin-bottom: 40px;">
        <!-- Stats will be loaded here -->
      </div>

      <div id="loading-state" style="text-align: center; padding: 40px;">
        <div class="spinner" style="margin: 0 auto; width: 40px; height: 40px;"></div>
      </div>

      <div class="content-card hidden" id="user-details">
        <div class="profile-info">
          <div class="label">Email Address</div>
          <div class="value" id="user-email">Loading...</div>
        </div>
        <div class="profile-info">
          <div class="label">Status</div>
          <div class="value" style="color: #10b981;">Active</div>
        </div>
      </div>

      <div id="toast-container"></div>
    </main>
  </div>
  <script type="module" src="/src/dashboard.js"></script>
</body>

</html>
