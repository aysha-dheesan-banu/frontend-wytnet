<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/logo.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Manage Users | WytPass SSO</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=Outfit:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/src/style.css">
    <style>
      body, html { margin: 0; padding: 0; height: 100vh; overflow: hidden; background: var(--bg-dark); }
      #app { display: flex; height: 100vh; width: 100vw; }
      
      /* Sidebar */
      .sidebar {
        width: 280px;
        background: rgba(15, 23, 42, 0.6);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border-right: 1px solid var(--border);
        display: flex;
        flex-direction: column;
        padding: 32px 24px;
        box-sizing: border-box;
      }
      .sidebar-header { margin-bottom: 40px; display: flex; align-items: center; gap: 12px; }
      .sidebar-header img { width: 40px; height: 40px; }
      .sidebar-header h2 { margin: 0; color: white; font-family: 'Outfit', sans-serif; font-size: 22px; font-weight: 600; }
      
      .nav-links { display: flex; flex-direction: column; gap: 8px; flex-grow: 1; }
      .nav-link {
        display: flex; align-items: center; gap: 12px; padding: 14px 16px; border-radius: 12px;
        color: var(--text-muted); text-decoration: none; font-weight: 500; font-size: 15px;
        transition: all 0.2s; border: 1px solid transparent;
      }
      .nav-link:hover { background: rgba(255, 255, 255, 0.05); color: white; }
      .nav-link.active { background: rgba(139, 92, 246, 0.15); color: var(--primary); border: 1px solid rgba(139, 92, 246, 0.3); }
      .nav-link svg { width: 20px; height: 20px; }
      
      .logout-section { margin-top: auto; padding-top: 24px; border-top: 1px solid var(--border); }
      #logout-btn {
        width: 100%; display: flex; align-items: center; justify-content: center; gap: 10px;
        padding: 14px; border-radius: 12px; font-size: 15px; font-weight: 600; cursor: pointer;
        background: rgba(239, 68, 68, 0.1); border: 1px solid rgba(239, 68, 68, 0.3); color: #f87171;
        transition: all 0.2s;
      }
      #logout-btn:hover { background: rgba(239, 68, 68, 0.2); }
      
      /* Main Content */
      .main-content {
        flex-grow: 1;
        overflow-y: auto;
        padding: 40px;
        box-sizing: border-box;
        position: relative;
      }
      .main-header { margin-bottom: 40px; display: flex; justify-content: space-between; align-items: center; }
      .main-header h1 { margin: 0 0 8px 0; font-size: 28px; color: white; }
      .main-header p { margin: 0; color: var(--text-muted); font-size: 16px; }
      
      /* Shared Portal Decorations */
      .portal-decoration { position: absolute; z-index: -1; pointer-events: none; }
      .portal-sphere-1 { top: -10%; right: -5%; width: 500px; height: 500px; background: radial-gradient(circle, rgba(139, 92, 246, 0.15) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; }
      .portal-sphere-2 { bottom: -10%; left: 20%; width: 600px; height: 600px; background: radial-gradient(circle, rgba(56, 189, 248, 0.1) 0%, rgba(0,0,0,0) 70%); border-radius: 50%; }

      /* Table Styles */
      .content-card {
        background: var(--card-bg);
        backdrop-filter: blur(20px);
        -webkit-backdrop-filter: blur(20px);
        border: 1px solid var(--border);
        border-radius: 24px;
        padding: 40px;
        box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
      }
      
      .table-container {
        width: 100%;
        overflow-x: auto;
        background: rgba(0,0,0,0.2);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        color: var(--text-main);
        font-size: 14px;
      }
      th, td { padding: 16px; text-align: left; border-bottom: 1px solid var(--border); }
      th { font-weight: 600; color: var(--text-muted); text-transform: uppercase; font-size: 12px; letter-spacing: 0.05em; }
      tr:last-child td { border-bottom: none; }
      
      .action-btn { background: transparent; border: none; cursor: pointer; padding: 6px; border-radius: 4px; transition: background 0.2s; color: var(--text-muted); }
      .action-btn:hover { background: rgba(255,255,255,0.1); color: var(--text-main); }
      .action-btn.delete:hover { background: rgba(239, 68, 68, 0.2); color: #f87171; }
      
      .badge { padding: 4px 8px; border-radius: 9999px; font-size: 12px; font-weight: 500; }
      .badge.active { background: rgba(16, 185, 129, 0.2); color: #34d399; }
      .badge.inactive { background: rgba(156, 163, 175, 0.2); color: #9ca3af; }
      
      /* Modal Styles */
      .modal-overlay {
        position: fixed; top: 0; left: 0; right: 0; bottom: 0;
        background: rgba(0, 0, 0, 0.7); backdrop-filter: blur(4px);
        display: flex; align-items: center; justify-content: center; z-index: 50;
        opacity: 0; pointer-events: none; transition: opacity 0.3s;
      }
      .modal-overlay.active { opacity: 1; pointer-events: auto; }
      .modal-content {
        background: var(--card-bg); border: 1px solid var(--border);
        border-radius: 16px; width: min(400px, 90vw); padding: 32px;
        transform: scale(0.95); transition: transform 0.3s;
      }
      .modal-overlay.active .modal-content { transform: scale(1); }
      
      .modal-header { margin-bottom: 24px; }
      .modal-header h2 { margin: 0; font-size: 20px; color: var(--text-main); }
      
      .modal-actions { display: flex; justify-content: flex-end; gap: 12px; margin-top: 24px; }
      .modal-actions button {
        padding: 10px 16px; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; transition: all 0.2s;
      }
      .btn-cancel { background: transparent; border: 1px solid var(--border); color: var(--text-main); }
      .btn-cancel:hover { background: rgba(255,255,255,0.1); }
      .btn-save { background: var(--primary); border: none; color: white; }
      .btn-save:hover { filter: brightness(1.1); }
    </style>
  </head>
  <body>
    <div id="app">
      <!-- Sidebar -->
      <nav class="sidebar">
        <div class="sidebar-header">
          <img src="/logo.png" alt="WytPass Logo">
          <h2>WytPass</h2>
        </div>
        
        <div class="nav-links">
          <a href="/dashboard.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 12l2-2m0 0l7-7 7 7M5 10v10a1 1 0 001 1h3m10-11l2 2m-2-2v10a1 1 0 01-1 1h-3m-6 0a1 1 0 001-1v-4a1 1 0 011-1h2a1 1 0 011 1v4a1 1 0 001 1m-6 0h6"></path></svg>
            Dashboard
          </a>
          <a href="/users.html" class="nav-link active">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4.354a4 4 0 110 5.292M15 21H3v-1a6 6 0 0112 0v1zm0 0h6v-1a6 6 0 00-9-5.197M13 7a4 4 0 11-8 0 4 4 0 018 0z"></path></svg>
            Manage Users
          </a>
          <a href="/clients.html" class="nav-link">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
            Manage Apps
          </a>
        </div>
        
        <div class="logout-section">
          <button id="logout-btn">
            <svg fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path></svg>
            Log Out
          </button>
        </div>
      </nav>

      <!-- Main Content -->
      <main class="main-content">
        <div class="portal-decoration portal-sphere-1"></div>
        <div class="portal-decoration portal-sphere-2"></div>
        
        <div class="main-header">
          <div>
            <h1>Manage Users</h1>
            <p>View, add, and manage user accounts.</p>
          </div>
          <button id="add-user-btn" class="btn" style="padding: 10px 20px; font-size: 14px; width: auto; background: var(--primary); border: none; color: white; border-radius: 8px; cursor: pointer;">
            + Add User
          </button>
        </div>

        <div class="content-card">
          <div class="table-container">
            <table>
              <thead>
                <tr>
                  <th>Email</th>
                  <th>Full Name</th>
                  <th>Status</th>
                  <th>Apps</th>
                  <th style="text-align: right;">Actions</th>
                </tr>
              </thead>
              <tbody id="users-table-body">
                <tr>
                  <td colspan="4" style="text-align: center; padding: 40px; color: var(--text-muted);">
                    <div class="spinner" style="margin: 0 auto 16px auto; width: 30px; height: 30px;"></div>
                    Loading users...
                  </td>
                </tr>
              </tbody>
            </table>
          </div>
        </div>
      </main>

      <!-- User Modal -->
      <div class="modal-overlay" id="user-modal">
        <div class="modal-content">
          <div class="modal-header">
            <h2 id="modal-title">Add User</h2>
          </div>
          <form id="user-form">
            <input type="hidden" id="user-id">
            
            <div class="input-group">
              <label for="user-email-input">Email Address</label>
              <input type="email" id="user-email-input" required>
            </div>
            
            <div class="input-group">
              <label for="user-name-input">Full Name</label>
              <input type="text" id="user-name-input">
            </div>
            
            <div class="input-group">
              <label for="user-password-input">Password <span id="pwd-hint" style="font-size: 11px; color: var(--text-muted); font-weight: normal;"></span></label>
              <input type="password" id="user-password-input">
            </div>
            
            <div class="input-group" style="display: flex; align-items: center; gap: 10px;">
              <input type="checkbox" id="user-active-input" checked style="width: auto; padding: 0;">
              <label for="user-active-input" style="margin: 0;">Account is Active</label>
            </div>
            
            <div class="modal-actions">
              <button type="button" class="btn-cancel" id="cancel-modal-btn">Cancel</button>
              <button type="submit" class="btn-save" id="save-modal-btn">Save User</button>
            </div>
          </form>
        </div>
      </div>
      
      <!-- Delete Confirmation Modal -->
      <div class="modal-overlay" id="delete-modal">
        <div class="modal-content" style="width: min(350px, 90vw);">
          <div class="modal-header">
            <h2 style="color: #f87171;">Delete User</h2>
          </div>
          <p style="color: var(--text-muted); margin-bottom: 24px; line-height: 1.5;">Are you sure you want to delete <strong id="delete-user-email" style="color: var(--text-main);"></strong>? This action cannot be undone.</p>
          <div class="modal-actions">
            <button type="button" class="btn-cancel" id="cancel-delete-btn">Cancel</button>
            <button type="button" class="btn-save" id="confirm-delete-btn" style="background: #ef4444;">Delete</button>
          </div>
        </div>
      </div>
      
      <div id="toast-container"></div>
    </div>
    <script type="module" src="/src/users.js"></script>
  </body>
</html>
