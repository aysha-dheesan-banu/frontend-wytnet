<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tasks | Project A</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <style>
        .task-input-group {
            display: flex;
            gap: 12px;
            margin-bottom: 24px;
        }
        .task-input {
            flex: 1;
            padding: 12px 16px;
            border-radius: 12px;
            border: 1px solid var(--border);
            outline: none;
            font-size: 15px;
            transition: var(--transition);
        }
        .task-input:focus { border-color: var(--primary); box-shadow: 0 0 0 4px rgba(59, 130, 246, 0.1); }
        .add-btn {
            padding: 12px 24px;
            background: var(--primary);
            color: white;
            border: none;
            border-radius: 12px;
            font-weight: 600;
            cursor: pointer;
        }
        .task-list { list-style: none; }
        .task-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 16px;
            background: #f8fafc;
            border: 1px solid var(--border);
            border-radius: 12px;
            margin-bottom: 10px;
            transition: var(--transition);
        }
        .task-item:hover { transform: translateX(4px); border-color: var(--primary); }
        .task-info { display: flex; align-items: center; gap: 12px; }
        .task-checkbox { width: 18px; height: 18px; cursor: pointer; }
        .task-text.completed { text-decoration: line-through; color: var(--text-muted); }
        .delete-btn {
            color: #ef4444;
            background: none;
            border: none;
            cursor: pointer;
            font-size: 18px;
            opacity: 0.5;
        }
        .delete-btn:hover { opacity: 1; }
    </style>
</head>
<body>
    <div class="container" style="max-width: 600px;">
        <div class="card dashboard-card" style="text-align: left;">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 24px;">
                <div class="logo" style="margin-bottom: 0;">Project A</div>
                <div style="display: flex; align-items: center; gap: 12px;">
                    <div id="user-avatar" class="avatar" style="width: 32px; height: 32px; font-size: 14px;">U</div>
                    <button id="logout-btn" class="logout-btn" style="padding: 6px 12px; font-size: 13px;">Logout</button>
                </div>
            </div>
            
            <h1 style="font-size: 20px;">My Tasks</h1>
            <p style="margin-bottom: 24px;">Manage your daily to-dos in Project A</p>

            <div class="task-input-group">
                <input type="text" id="new-task-input" class="task-input" placeholder="What needs to be done?">
                <button id="add-task-btn" class="add-btn">Add</button>
            </div>

            <ul id="task-list" class="task-list">
                <!-- Tasks will appear here -->
            </ul>

            <div style="margin-top: 32px; padding-top: 24px; border-top: 1px solid var(--border); font-size: 13px; color: var(--text-muted);">
                Logged in as <strong id="display-email">...</strong> via Whitepass SSO
            </div>
        </div>
    </div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const user = JSON.parse(localStorage.getItem('user'));
            const token = localStorage.getItem('access_token');

            if (!user || !token) {
                window.location.href = 'index.html';
                return;
            }

            document.getElementById('display-email').textContent = user.email;
            document.getElementById('user-avatar').textContent = (user.name || user.email).charAt(0).toUpperCase();

            const taskList = document.getElementById('task-list');
            const newTaskInput = document.getElementById('new-task-input');
            const addTaskBtn = document.getElementById('add-task-btn');

            let tasks = JSON.parse(localStorage.getItem('tasks') || '[]');

            function renderTasks() {
                taskList.innerHTML = tasks.map((task, i) => `
                    <li class="task-item">
                        <div class="task-info">
                            <input type="checkbox" class="task-checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${i})">
                            <span class="task-text ${task.completed ? 'completed' : ''}">${task.text}</span>
                        </div>
                        <button class="delete-btn" onclick="deleteTask(${i})">&times;</button>
                    </li>
                `).join('');
                if (tasks.length === 0) {
                    taskList.innerHTML = '<li style="text-align:center; color:var(--text-muted); padding: 20px;">No tasks yet. Add one above!</li>';
                }
                localStorage.setItem('tasks', JSON.stringify(tasks));
            }

            window.toggleTask = (index) => {
                tasks[index].completed = !tasks[index].completed;
                renderTasks();
            };

            window.deleteTask = (index) => {
                tasks.splice(index, 1);
                renderTasks();
            };

            addTaskBtn.addEventListener('click', () => {
                const text = newTaskInput.value.trim();
                if (text) {
                    tasks.unshift({ text, completed: false });
                    newTaskInput.value = '';
                    renderTasks();
                }
            });

            newTaskInput.addEventListener('keypress', (e) => {
                if (e.key === 'Enter') addTaskBtn.click();
            });

            renderTasks();

            document.getElementById('logout-btn').addEventListener('click', () => {
                localStorage.clear();
                window.location.href = 'index.html';
            });
        });
    </script>
</body>
</html>
